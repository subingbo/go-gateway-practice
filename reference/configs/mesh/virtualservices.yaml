apiVersion: mesh/v1
kind: VirtualService
metadata:
  name: user-service
spec:
  hosts:
    - user-service
  http:
    # 带 x-canary: true 的请求固定打到 v2。
    - name: canary-header
      match:
        - headers:
            x-canary: "true"
      route:
        - destination:
            subset: v2
          weight: 100

    # 故障注入：100% 返回 500，用于观察重试与熔断。
    - name: faulty
      match:
        - path_prefix: /users/faulty
      fault:
        abort:
          percentage: 100
          http_status: 500
      retries:
        attempts: 2
        per_try_timeout: 300ms
        retry_on:
          - 5xx
      route:
        - destination:
            subset: v1
          weight: 100

    # 默认 90/10 金丝雀。
    - name: default
      route:
        - destination:
            subset: v1
          weight: 90
        - destination:
            subset: v2
          weight: 10
      timeout: 2s
      retries:
        attempts: 2
        per_try_timeout: 500ms
        retry_on:
          - 5xx
          - reset
          - connect

---
apiVersion: mesh/v1
kind: VirtualService
metadata:
  name: order-service
spec:
  hosts:
    - order-service
  http:
    - name: default
      route:
        - destination:
            subset: v1
          weight: 100
      timeout: 5s
