apiVersion: mesh/v1
kind: DestinationRule
metadata:
  name: user-service
spec:
  host: user-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  traffic_policy:
    load_balancer: least_request
    connection_pool:
      max_connections: 100
      max_pending_requests: 50
    outlier_detection:
      consecutive_5xx: 5
      ejection_time: 10s
    peer_authentication: PERMISSIVE

---
apiVersion: mesh/v1
kind: DestinationRule
metadata:
  name: order-service
spec:
  host: order-service
  subsets:
    - name: v1
      labels:
        version: v1
  traffic_policy:
    load_balancer: round_robin
    connection_pool:
      max_connections: 100
      max_pending_requests: 50
    outlier_detection:
      consecutive_5xx: 5
      ejection_time: 10s
    peer_authentication: PERMISSIVE
